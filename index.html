<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperOS Weather Dashboard</title>
  
  <!-- CSS Link -->
  <link rel="stylesheet" href="style.css" />
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

  <!-- Fullscreen Animated Background Canvas -->
  <canvas id="weatherBgCanvas"></canvas>

  <div class="app-container">
    
    <!-- Top Search Bar & Recent Tags Bar -->
    <div class="top-section">
      <div class="search-box">
        <i class="fa-solid fa-location-dot icon-location"></i>
        <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" />
        <button id="searchBtn" title="Search"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button id="geoBtn" title="Current Location"><i class="fa-solid fa-location-crosshairs"></i></button>
      </div>

      <!-- Recent Searches Tags -->
      <div id="recentSearches" class="recent-searches"></div>
    </div>

    <!-- Main Dashboard Desktop Layout (Side-by-Side split on Desktop) -->
    <div class="dashboard-layout">
      
      <!-- Left Panel: Header & Hourly Graph Card -->
      <div class="panel-left">
        <!-- Location Header -->
        <div class="dash-header">
          <div>
            <h1 id="cityName">Lucknow</h1>
            <p id="weatherState" class="weather-state">Partly Cloudy</p>
          </div>
          <div class="header-actions">
            <i class="fa-solid fa-plus"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </div>
        </div>

        <!-- Hourly Line Graph & Forecast Strip -->
        <div class="hourly-card">
          <div class="hourly-header">
            <span>24-Hour Forecast</span>
          </div>
          <div class="hourly-chart-wrapper">
            <canvas id="hourlyCanvas"></canvas>
          </div>
          <div class="hourly-items" id="hourlyItemsContainer">
            <!-- Dynamic Hourly Weather Details via JS -->
          </div>
        </div>
      </div>

      <!-- Right Panel: 2x3 Widgets Grid + AQI Pill -->
      <div class="panel-right">
        
        <!-- 2x3 Widgets Grid -->
        <div class="widgets-grid">
          
          <!-- 1. UV Index -->
          <div class="widget-card">
            <span class="widget-label">UV</span>
            <div class="widget-val" id="uvStatusText">Moderate</div>
            <div class="gauge-container">
              <svg viewBox="0 0 100 60" class="gauge">
                <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                <path id="uvGaugePath" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#ff4081" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="60"/>
              </svg>
              <div class="gauge-center-text" id="uvVal">5</div>
            </div>
          </div>

          <!-- 2. Humidity -->
          <div class="widget-card">
            <span class="widget-label">Humidity</span>
            <div class="widget-val" id="humidityVal">68%</div>
            <div class="gauge-container">
              <svg viewBox="0 0 100 60" class="gauge">
                <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                <path id="humidityGaugePath" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#2196f3" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="40"/>
              </svg>
              <i class="fa-solid fa-droplet gauge-icon"></i>
            </div>
          </div>

          <!-- 3. Real Feel -->
          <div class="widget-card">
            <span class="widget-label">Real feel</span>
            <div class="widget-val" id="feelsLikeVal">31°</div>
            <div class="gauge-container">
              <svg viewBox="0 0 100 60" class="gauge">
                <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                <path id="feelsGaugePath" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#00e676" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="50"/>
              </svg>
            </div>
          </div>

          <!-- 4. Wind Direction & Speed -->
          <div class="widget-card">
            <span class="widget-label" id="windDirText">Northeast</span>
            <div class="widget-val" id="windSpeedVal">11.5 <span class="unit-text">km/h</span></div>
            <div class="compass-wrapper">
              <div class="compass-ring">
                <span class="comp-n">N</span><span class="comp-e">E</span>
                <span class="comp-s">S</span><span class="comp-w">W</span>
                <div class="compass-arrow" id="compassArrow"></div>
              </div>
            </div>
          </div>

          <!-- 5. Sunset Arc -->
          <div class="widget-card">
            <span class="widget-label">Sunset</span>
            <div class="widget-val" id="sunsetTime">18:03</div>
            <div class="sunset-wrapper">
              <svg viewBox="0 0 100 50" class="sunset-svg">
                <path d="M 10 45 Q 50 5 90 45" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="3,3"/>
                <path d="M 10 45 Q 50 5 90 45" fill="none" stroke="#ff9800" stroke-width="3"/>
                <circle cx="50" cy="18" r="4" fill="#ffeb3b"/>
              </svg>
              <div class="sunset-sub-times">
                <span id="sunriseVal">05:55</span>
                <span id="sunsetVal">18:03</span>
              </div>
            </div>
          </div>

          <!-- 6. Pressure -->
          <div class="widget-card">
            <span class="widget-label">Pressure</span>
            <div class="widget-val" id="pressureVal">1009</div>
            <div class="gauge-container">
              <svg viewBox="0 0 100 60" class="gauge">
                <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-linecap="round"/>
                <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#00bcd4" stroke-width="8" stroke-linecap="round" stroke-dasharray="126" stroke-dashoffset="30"/>
              </svg>
              <span class="sub-unit">mbar</span>
            </div>
          </div>

        </div>

        <!-- Bottom AQI Pill -->
        <div class="aqi-pill">
          <i class="fa-solid fa-leaf"></i>
          <span id="aqiText">AQI 75 • Moderate</span>
        </div>

      </div>

    </div>
  </div>

  <!-- JS Link -->
  <script src="script.js"></script>
</body>
</html>
